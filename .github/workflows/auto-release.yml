name: Auto Release on Dependabot Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Tests
        run: bun test

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            # Create release branch, bump version, and create PR
            git checkout -b release-bump-$(date +%Y%m%d-%H%M%S)
            npm version patch
            NEW_VERSION=$(node -p "require('./package.json').version")
            git push origin HEAD --follow-tags
            gh pr create --fill --base main --title "chore: release v${NEW_VERSION} (auto)"
            # Auto-merge since dependencies already passed tests
            gh pr merge --auto --squash
